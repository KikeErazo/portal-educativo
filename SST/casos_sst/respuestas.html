    <script>
        const answers = [


            "1. ¿Quién responde si un empleado sufre un accidente laboral?<br>• <strong>Respuesta:</strong> El empleador es responsable de garantizar la seguridad y salud en el trabajo. Debe reportar el accidente a la ARL (Administradora de Riesgos Laborales) y proporcionar atención médica inmediata al trabajador. Además, debe investigar las causas del accidente y tomar medidas correctivas para prevenir futuros incidentes.<br><br><strong>Ejemplo 1:</strong> Si un empleado se lesiona al caer de una escalera en la oficina, el empleador debe asegurarse de que reciba atención médica y reportar el incidente a la ARL. También debe revisar las condiciones de la escalera y capacitar a los empleados en su uso seguro.<br><br><strong>Ejemplo 2:</strong> Si un trabajador se corta con una máquina en una fábrica, el empleador debe proporcionar primeros auxilios, reportar el accidente a la ARL y revisar las medidas de seguridad de la máquina.<br><br><strong>Normativa:</strong> Ley 1562 de 2012 y Decreto 1295 de 1994 establecen las responsabilidades del empleador en caso de accidentes laborales y la obligación de reportar a la ARL.",
            "2. ¿Quién responde si un contratista sufre un accidente laboral?<br>• <strong>Respuesta:</strong> El contratista debe estar afiliado a una ARL y es responsable de su propia seguridad. Sin embargo, el contratante debe asegurarse de que el contratista cumpla con las normas de seguridad y salud en el trabajo. El contratante también debe coordinar con la ARL del contratista para garantizar la atención médica y el reporte del accidente.<br><br><strong>Ejemplo 1:</strong> Si un contratista sufre una caída mientras realiza trabajos de mantenimiento en una empresa, el contratante debe verificar que el contratista esté afiliado a una ARL y que se sigan las normas de seguridad. Debe coordinar con la ARL para asegurar la atención médica del contratista.<br><br><strong>Ejemplo 2:</strong> Si un contratista se electrocuta mientras instala un sistema eléctrico, el contratante debe asegurarse de que el contratista reciba atención médica y que el accidente sea reportado a la ARL.<br><br><strong>Normativa:</strong> Decreto 1072 de 2015 establece las responsabilidades del contratante y del contratista en materia de seguridad y salud en el trabajo.",
            "3. ¿Quién responde si un empleado sufre un accidente laboral en un vehículo de la empresa?<br>• <strong>Respuesta:</strong> El empleador es responsable si el accidente ocurre durante el cumplimiento de las funciones laborales del empleado. Debe reportar el accidente a la ARL y proporcionar atención médica. Además, debe investigar las causas del accidente y tomar medidas para mejorar la seguridad vial.<br><br><strong>Ejemplo 1:</strong> Si un empleado sufre un accidente de tráfico mientras realiza una entrega en un vehículo de la empresa, el empleador debe reportar el accidente y asegurar la atención médica del empleado. También debe revisar las condiciones del vehículo y capacitar a los empleados en conducción segura.<br><br><strong>Ejemplo 2:</strong> Si un trabajador se lesiona en un accidente mientras transporta materiales en un camión de la empresa, el empleador debe proporcionar primeros auxilios, reportar el accidente a la ARL y revisar las medidas de seguridad del transporte.<br><br><strong>Normativa:</strong> Ley 1562 de 2012 y Decreto 1295 de 1994 establecen las responsabilidades del empleador en caso de accidentes laborales y la obligación de reportar a la ARL.",
            "4. ¿Qué debe hacer un empleador si un trabajador presenta una enfermedad laboral?<br>• <strong>Respuesta:</strong> El empleador debe reportar la enfermedad a la ARL y tomar medidas para prevenir futuros casos. Esto incluye realizar evaluaciones médicas periódicas, mejorar las condiciones laborales y proporcionar equipos de protección personal (EPP) adecuados.<br><br><strong>Ejemplo 1:</strong> Si un trabajador desarrolla una enfermedad respiratoria debido a la exposición a polvo en la fábrica, el empleador debe reportar el caso a la ARL, mejorar la ventilación y proporcionar mascarillas adecuadas.<br><br><strong>Ejemplo 2:</strong> Si un empleado presenta una enfermedad de la piel por contacto con productos químicos, el empleador debe reportar la enfermedad, proporcionar guantes y mejorar las prácticas de manejo de productos químicos.<br><br><strong>Normativa:</strong> Resolución 2346 de 2007 establece las medidas para la prevención y control de enfermedades laborales y la obligación de reportar a la ARL.",
            "5. ¿Qué medidas debe tomar un empleador para prevenir caídas desde altura?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de prevención y protección contra caídas, como el uso de arneses de seguridad, barandillas, redes de protección y plataformas de trabajo seguras. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En una construcción, los trabajadores deben usar arneses de seguridad y la zona de trabajo debe estar equipada con barandillas y redes para prevenir caídas. Deben estar capacitados en el uso de los arneses y en procedimientos de rescate.<br><br><strong>Ejemplo 2:</strong> En trabajos de mantenimiento en techos, los trabajadores deben usar líneas de vida y plataformas de trabajo seguras. Deben recibir capacitación en el uso de estos equipos y en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 1409 de 2012 establece las medidas de protección contra caídas y la capacitación necesaria para garantizar la seguridad de los trabajadores en alturas.",
            "6. ¿Qué responsabilidades tiene un empleador en caso de exposición de los trabajadores a sustancias químicas?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección personal (EPP) como guantes, gafas y mascarillas, y capacitar a los trabajadores en el manejo seguro de sustancias químicas. Además, debe asegurar una ventilación adecuada en el lugar de trabajo y realizar monitoreos periódicos de los niveles de exposición.<br><br><strong>Ejemplo 1:</strong> En una planta química, los trabajadores deben usar guantes resistentes a productos químicos, gafas de seguridad y mascarillas adecuadas. La planta debe estar equipada con sistemas de ventilación para evitar la acumulación de vapores tóxicos.<br><br><strong>Ejemplo 2:</strong> En un laboratorio, los trabajadores deben usar equipos de protección personal cuando manipulen sustancias peligrosas y estar capacitados en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a sustancias químicas.",
            "7. ¿Qué debe hacer un empleador si un trabajador sufre un accidente con maquinaria?<br>• <strong>Respuesta:</strong> El empleador debe asegurar que la maquinaria esté en buen estado y que los empleados estén capacitados para su uso. Debe proporcionar equipos de protección personal (EPP) como guantes y protectores auditivos, y realizar mantenimientos periódicos de la maquinaria. Además, debe investigar las causas del accidente y tomar medidas correctivas.<br><br><strong>Ejemplo 1:</strong> Si un trabajador se lesiona con una prensa hidráulica, el empleador debe verificar que la máquina tenga las protecciones adecuadas y que el trabajador esté capacitado en su uso. Debe proporcionar guantes y protectores auditivos.<br><br><strong>Ejemplo 2:</strong> Si un empleado se corta con una sierra en una carpintería, el empleador debe asegurar que la sierra tenga protectores y que el trabajador esté capacitado en su uso seguro. Debe proporcionar gafas de seguridad y guantes.<br><br><strong>Normativa:</strong> Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir accidentes con maquinaria.",


            "8. ¿Qué medidas de seguridad deben implementarse en trabajos subacuáticos?<br>• <strong>Respuesta:</strong> El empleador debe garantizar la seguridad y salud de los trabajadores mediante la implementación de equipos de buceo adecuados, capacitación específica y supervisión constante. Además, debe realizar evaluaciones de riesgos y establecer procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En trabajos de mantenimiento subacuático, los buzos deben usar trajes de buceo, tanques de oxígeno y estar supervisados por un equipo de apoyo en la superficie. Deben estar capacitados en procedimientos de emergencia.<br><br><strong>Ejemplo 2:</strong> En la construcción de estructuras subacuáticas, los trabajadores deben usar equipos de buceo adecuados y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el manejo de equipos y en procedimientos de rescate.<br><br><strong>Normativa:</strong> Resolución 1401 de 2007 establece las medidas de seguridad y la capacitación necesaria para garantizar la seguridad de los trabajadores en trabajos subacuáticos.",
            "9. ¿Qué debe hacer un empleador si un trabajador sufre quemaduras por contacto eléctrico?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes aislantes y capacitar a los trabajadores en el manejo seguro de equipos eléctricos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras eléctricas.<br><br><strong>Ejemplo 1:</strong> Si un electricista sufre una quemadura al trabajar con un panel eléctrico, debe usar guantes aislantes y seguir los procedimientos de seguridad. El empleador debe proporcionar primeros auxilios y reportar el incidente a la ARL.<br><br><strong>Ejemplo 2:</strong> En una planta de fabricación, los trabajadores deben usar equipos de protección personal cuando realicen mantenimiento de maquinaria eléctrica y estar capacitados en procedimientos de primeros auxilios para quemaduras eléctricas.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir quemaduras por contacto eléctrico.",
            "10. ¿Qué medidas debe tomar un empleador para prevenir la caída de objetos en el lugar de trabajo?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de seguridad como el uso de cascos de seguridad, redes de protección y señalización adecuada. Además, debe asegurar que las áreas de trabajo estén libres de obstáculos y que los trabajadores estén capacitados en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En una obra de construcción, los trabajadores deben usar cascos de seguridad y las áreas de trabajo deben estar señalizadas para prevenir la caída de objetos. Deben estar capacitados en el uso de redes de protección.<br><br><strong>Ejemplo 2:</strong> En un almacén, los trabajadores deben usar cascos de seguridad y las estanterías deben estar aseguradas para evitar la caída de materiales. Deben recibir capacitación en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir la caída de objetos en el lugar de trabajo.",
            "11. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por esfuerzo repetitivo?<br>• <strong>Respuesta:</strong> El empleador debe realizar evaluaciones ergonómicas y proporcionar descansos adecuados, así como equipos ergonómicos como sillas ajustables y soportes para muñecas. Además, debe capacitar a los trabajadores en técnicas de trabajo seguro y en la importancia de los descansos regulares.<br><br><strong>Ejemplo 1:</strong> En una oficina, los empleados deben tener sillas ergonómicas y tomar descansos regulares para evitar lesiones por esfuerzo repetitivo. El empleador debe proporcionar soportes para muñecas y capacitar a los empleados en técnicas de trabajo seguro.<br><br><strong>Ejemplo 2:</strong> En una línea de ensamblaje, los trabajadores deben usar equipos ergonómicos y realizar ejercicios de estiramiento durante los descansos. El empleador debe realizar evaluaciones ergonómicas periódicas.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas ergonómicas y la capacitación necesaria para prevenir lesiones por esfuerzo repetitivo.",
            "12. ¿Qué responsabilidades tiene un empleador en caso de exposición a ruido excesivo en el lugar de trabajo?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de control de ruido y proporcionar protección auditiva como tapones o auriculares. Además, debe realizar monitoreos periódicos de los niveles de ruido y capacitar a los trabajadores en el uso adecuado de los equipos de protección auditiva.<br><br><strong>Ejemplo 1:</strong> En una fábrica con maquinaria ruidosa, los trabajadores deben usar tapones auditivos y la empresa debe instalar barreras acústicas para reducir el ruido. Deben estar capacitados en el uso adecuado de los tapones auditivos.<br><br><strong>Ejemplo 2:</strong> En una planta de procesamiento de alimentos, los trabajadores deben usar auriculares protectores y la empresa debe realizar monitoreos periódicos de los niveles de ruido.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección auditiva y la capacitación necesaria para prevenir daños auditivos por exposición a ruido excesivo.",
            "13. ¿Qué debe hacer un empleador si un trabajador sufre un accidente por resbalón o tropiezo?<br>• <strong>Respuesta:</strong> El empleador debe mantener las áreas de trabajo limpias y libres de obstáculos, y proporcionar calzado antideslizante. Además, debe asegurar que las superficies de trabajo sean seguras y que los trabajadores estén capacitados en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En una cocina industrial, los empleados deben usar calzado antideslizante y las áreas de trabajo deben estar libres de derrames. El empleador debe proporcionar primeros auxilios en caso de accidentes.<br><br><strong>Ejemplo 2:</strong> En una oficina, los pasillos deben estar libres de cables y obstáculos, y los empleados deben usar calzado adecuado. El empleador debe capacitar a los empleados en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir accidentes por resbalones o tropiezos.",

            "14. ¿Qué medidas de seguridad deben implementarse en trabajos en espacios confinados?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como respiradores y arneses de seguridad, y capacitar a los trabajadores en procedimientos de emergencia. Además, debe realizar evaluaciones de riesgos y asegurar que los trabajadores tengan acceso a equipos de comunicación y rescate.<br><br><strong>Ejemplo 1:</strong> En trabajos de mantenimiento en tanques, los trabajadores deben usar respiradores y arneses de seguridad. Deben estar capacitados en procedimientos de emergencia y tener acceso a equipos de comunicación.<br><br><strong>Ejemplo 2:</strong> En la limpieza de alcantarillas, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el uso de equipos de rescate.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores en espacios confinados.",
            "15. ¿Qué debe hacer un empleador si un trabajador sufre una lesión ocular en el lugar de trabajo?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar protección ocular como gafas de seguridad y realizar evaluaciones de riesgos. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección ocular y en procedimientos de primeros auxilios en caso de lesiones oculares.<br><br><strong>Ejemplo 1:</strong> En un taller de carpintería, los trabajadores deben usar gafas de seguridad para protegerse de astillas y polvo. El empleador debe proporcionar primeros auxilios en caso de lesiones oculares.<br><br><strong>Ejemplo 2:</strong> En una planta química, los trabajadores deben usar gafas de seguridad cuando manipulen sustancias peligrosas. Deben estar capacitados en procedimientos de primeros auxilios para lesiones oculares.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección ocular y la capacitación necesaria para prevenir lesiones oculares en el lugar de trabajo.",
            "16. ¿Qué responsabilidades tiene un empleador en caso de exposición a radiaciones ionizantes?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de protección radiológica como el uso de dosímetros y barreras de plomo, y realizar monitoreos periódicos de los niveles de radiación. Además, debe capacitar a los trabajadores en el manejo seguro de equipos que emiten radiaciones ionizantes y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En un hospital, los técnicos de radiología deben usar dosímetros y trabajar en áreas protegidas con barreras de plomo. Deben estar capacitados en procedimientos de emergencia en caso de exposición a radiaciones.<br><br><strong>Ejemplo 2:</strong> En una planta de investigación nuclear, los trabajadores deben usar equipos de protección radiológica y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el manejo seguro de materiales radiactivos.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección radiológica y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a radiaciones ionizantes.",
            "17. ¿Qué debe hacer un empleador si un trabajador sufre un accidente por manipulación manual de cargas?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar capacitación en técnicas de manipulación segura y equipos de ayuda como carretillas y elevadores. Además, debe realizar evaluaciones ergonómicas y asegurar que los trabajadores conozcan los procedimientos de primeros auxilios en caso de lesiones.<br><br><strong>Ejemplo 1:</strong> En un almacén, los trabajadores deben recibir capacitación en levantamiento seguro y usar carretillas para mover cargas pesadas. El empleador debe proporcionar primeros auxilios en caso de lesiones.<br><br><strong>Ejemplo 2:</strong> En una fábrica, los trabajadores deben usar equipos de ayuda como elevadores y seguir técnicas de manipulación segura. Deben estar capacitados en procedimientos de primeros auxilios.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas ergonómicas y la capacitación necesaria para prevenir lesiones por manipulación manual de cargas.",
            "18. ¿Qué medidas de seguridad deben implementarse en trabajos en altura?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección contra caídas como arneses, líneas de vida y barandillas, y realizar evaluaciones de riesgos antes de comenzar el trabajo. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En trabajos de limpieza de ventanas en edificios altos, los trabajadores deben usar arneses de seguridad conectados a líneas de vida y trabajar en plataformas con barandillas. Deben estar capacitados en el uso de los arneses y en procedimientos de rescate.<br><br><strong>Ejemplo 2:</strong> En la construcción de puentes, los trabajadores deben usar arneses y líneas de vida cuando trabajen en alturas. Deben recibir capacitación en el uso de estos equipos y en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 1409 de 2012 establece las medidas de protección contra caídas y la capacitación necesaria para garantizar la seguridad de los trabajadores en alturas.",
            "19. ¿Qué debe hacer un empleador si un trabajador sufre una intoxicación por inhalación de gases?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección respiratoria como mascarillas y respiradores, y asegurar una ventilación adecuada en el lugar de trabajo. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección respiratoria y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En una planta química, los trabajadores deben usar respiradores adecuados y el área debe estar equipada con sistemas de ventilación para evitar la acumulación de gases tóxicos. Deben estar capacitados en procedimientos de emergencia.<br><br><strong>Ejemplo 2:</strong> En una mina subterránea, los trabajadores deben usar mascarillas y respiradores para protegerse de gases peligrosos. Deben recibir capacitación en el uso de estos equipos y en procedimientos de rescate.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección respiratoria y la capacitación necesaria para prevenir intoxicaciones por inhalación de gases.",
            "20. ¿Qué responsabilidades tiene un empleador en caso de exposición a vibraciones en el lugar de trabajo?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de control de vibraciones, proporcionar equipos de protección como guantes antivibración y realizar evaluaciones periódicas de los niveles de vibración. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección y en técnicas para minimizar la exposición a vibraciones.<br><br><strong>Ejemplo 1:</strong> En una fábrica donde se utilizan herramientas vibrantes, los trabajadores deben usar guantes antivibración y las máquinas deben ser revisadas regularmente para minimizar las vibraciones. Deben estar capacitados en técnicas para reducir la exposición a vibraciones.<br><br><strong>Ejemplo 2:</strong> En la construcción, los operadores de maquinaria pesada deben usar equipos de protección antivibración y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el uso de estos equipos y en técnicas para minimizar la exposición a vibraciones.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a vibraciones.",


  "21. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con sustancias corrosivas?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes resistentes a productos químicos, gafas de seguridad y delantales, y capacitar a los trabajadores en el manejo seguro de sustancias corrosivas. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de contacto con sustancias corrosivas.<br><br><strong>Ejemplo 1:</strong> En un laboratorio químico, los trabajadores deben usar guantes, gafas y delantales cuando manipulen ácidos o bases fuertes. Las áreas de trabajo deben estar señalizadas con advertencias sobre sustancias corrosivas.<br><br><strong>Ejemplo 2:</strong> En una planta de tratamiento de aguas, los trabajadores deben usar equipos de protección personal cuando manipulen productos químicos corrosivos. Deben estar capacitados en procedimientos de primeros auxilios para tratar quemaduras químicas.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con sustancias corrosivas.",
  "22. ¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de explosión?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de prevención como la eliminación de fuentes de ignición, el uso de equipos a prueba de explosiones y la capacitación de los trabajadores en procedimientos de emergencia. Además, debe realizar evaluaciones de riesgos y asegurar que los trabajadores conozcan los procedimientos de evacuación en caso de explosión.<br><br><strong>Ejemplo 1:</strong> En una planta de procesamiento de gas, se deben eliminar las fuentes de ignición y utilizar equipos eléctricos a prueba de explosiones. Los trabajadores deben estar capacitados en procedimientos de evacuación.<br><br><strong>Ejemplo 2:</strong> En una fábrica de productos químicos, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para prevenir explosiones. Deben recibir capacitación en el manejo seguro de materiales inflamables.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de prevención y protección necesarias para garantizar la seguridad de los trabajadores en trabajos con riesgo de explosión.",
  "23. ¿Qué debe hacer un empleador si un trabajador sufre un accidente por atrapamiento en maquinaria?<br>• <strong>Respuesta:</strong> El empleador debe asegurar que la maquinaria esté equipada con dispositivos de seguridad como protectores y sistemas de parada de emergencia, y capacitar a los trabajadores en su uso seguro. Además, debe realizar mantenimientos periódicos de la maquinaria y asegurar que los trabajadores conozcan los procedimientos de primeros auxilios en caso de atrapamiento.<br><br><strong>Ejemplo 1:</strong> En una fábrica de textiles, las máquinas deben tener protectores para evitar el atrapamiento de manos y los trabajadores deben estar capacitados en el uso de los sistemas de parada de emergencia. Deben recibir capacitación en procedimientos de primeros auxilios.<br><br><strong>Ejemplo 2:</strong> En una planta de procesamiento de alimentos, las máquinas deben estar equipadas con sistemas de seguridad y los trabajadores deben estar capacitados en su uso seguro. Deben conocer los procedimientos de emergencia en caso de atrapamiento.<br><br><strong>Normativa:</strong> Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir accidentes por atrapamiento en maquinaria.",
  "24. ¿Qué responsabilidades tiene un empleador en caso de exposición a temperaturas extremas?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección adecuados como ropa térmica o refrigerada, y asegurar descansos regulares en ambientes controlados. Además, debe capacitar a los trabajadores en técnicas para minimizar la exposición a temperaturas extremas y en procedimientos de primeros auxilios.<br><br><strong>Ejemplo 1:</strong> En trabajos al aire libre en invierno, los trabajadores deben usar ropa térmica y tener acceso a áreas calentadas para descansar. Deben estar capacitados en técnicas para prevenir la hipotermia.<br><br><strong>Ejemplo 2:</strong> En trabajos en hornos industriales, los trabajadores deben usar ropa refrigerada y tener acceso a áreas frescas para descansar. Deben recibir capacitación en técnicas para prevenir el golpe de calor.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a temperaturas extremas.",
  "25. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por caída de altura?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección contra caídas como arneses y líneas de vida, y asegurar que las áreas de trabajo en altura estén equipadas con barandillas y redes de seguridad. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En la construcción de un edificio, los trabajadores deben usar arneses de seguridad y las plataformas de trabajo deben tener barandillas y redes de protección. Deben estar capacitados en el uso de los arneses y en procedimientos de rescate.<br><br><strong>Ejemplo 2:</strong> En trabajos de mantenimiento en torres de telecomunicaciones, los trabajadores deben usar líneas de vida y arneses de seguridad. Deben recibir capacitación en el uso de estos equipos y en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 1409 de 2012 establece las medidas de protección contra caídas y la capacitación necesaria para garantizar la seguridad de los trabajadores en alturas.",
  "26. ¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de incendio?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de prevención de incendios como la instalación de extintores, sistemas de detección de humo y la capacitación de los trabajadores en procedimientos de evacuación. Además, debe realizar evaluaciones de riesgos y asegurar que los trabajadores conozcan los procedimientos de emergencia en caso de incendio.<br><br><strong>Ejemplo 1:</strong> En una fábrica de textiles, se deben instalar extintores en lugares estratégicos y realizar simulacros de evacuación periódicos. Los trabajadores deben estar capacitados en el uso de extintores y en procedimientos de evacuación.<br><br><strong>Ejemplo 2:</strong> En una planta de procesamiento de alimentos, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para prevenir incendios. Deben recibir capacitación en el manejo de extintores y en procedimientos de evacuación.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de prevención y protección necesarias para garantizar la seguridad de los trabajadores en trabajos con riesgo de incendio.",
  "27. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con animales peligrosos?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes y botas, y capacitar a los trabajadores en el manejo seguro de animales peligrosos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de mordeduras o picaduras.<br><br><strong>Ejemplo 1:</strong> En una granja, los trabajadores deben usar guantes y botas cuando manejen animales como cerdos o vacas. Las áreas de trabajo deben estar señalizadas con advertencias sobre animales peligrosos.<br><br><strong>Ejemplo 2:</strong> En un zoológico, los cuidadores deben usar equipos de protección personal cuando trabajen con animales peligrosos y estar capacitados en procedimientos de primeros auxilios para mordeduras o picaduras.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con animales peligrosos.",


  "28. ¿Qué responsabilidades tiene un empleador en caso de exposición a agentes biológicos?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de protección biológica como el uso de guantes, mascarillas y batas, y realizar monitoreos periódicos de los agentes biológicos presentes en el lugar de trabajo. Además, debe capacitar a los trabajadores en el manejo seguro de agentes biológicos y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En un laboratorio de microbiología, los trabajadores deben usar guantes, mascarillas y batas para protegerse de agentes biológicos. Deben estar capacitados en procedimientos de emergencia en caso de exposición.<br><br><strong>Ejemplo 2:</strong> En una planta de tratamiento de aguas residuales, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para prevenir la exposición a agentes biológicos. Deben recibir capacitación en el manejo seguro de estos agentes.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección biológica y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a agentes biológicos.",
  "29. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con herramientas manuales?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes y gafas de seguridad, y capacitar a los trabajadores en el uso seguro de herramientas manuales. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de lesiones.<br><br><strong>Ejemplo 1:</strong> En un taller de carpintería, los trabajadores deben usar guantes y gafas de seguridad cuando utilicen sierras y martillos. Las áreas de trabajo deben estar señalizadas con advertencias sobre herramientas manuales.<br><br><strong>Ejemplo 2:</strong> En una fábrica de metal, los trabajadores deben usar guantes y gafas de seguridad cuando trabajen con láminas de metal. Deben estar capacitados en procedimientos de primeros auxilios para tratar cortes y heridas.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con herramientas manuales.",
  "30. ¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de derrumbe?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de prevención como el uso de apuntalamientos y barreras de contención, y capacitar a los trabajadores en procedimientos de emergencia. Además, debe realizar evaluaciones de riesgos y asegurar que los trabajadores conozcan los procedimientos de evacuación en caso de derrumbe.<br><br><strong>Ejemplo 1:</strong> En una excavación, se deben usar apuntalamientos para evitar derrumbes y los trabajadores deben estar capacitados en procedimientos de evacuación. Las áreas de trabajo deben estar señalizadas con advertencias sobre riesgo de derrumbe.<br><br><strong>Ejemplo 2:</strong> En la construcción de túneles, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para prevenir derrumbes. Deben recibir capacitación en el uso de apuntalamientos y en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de prevención y protección necesarias para garantizar la seguridad de los trabajadores en trabajos con riesgo de derrumbe.",
  "31. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con equipos de soldadura?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como caretas de soldador, guantes y delantales, y capacitar a los trabajadores en el uso seguro de equipos de soldadura. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br><br><strong>Ejemplo 1:</strong> En un taller de soldadura, los trabajadores deben usar caretas de soldador, guantes y delantales para protegerse de las chispas y el calor. Las áreas de trabajo deben estar señalizadas con advertencias sobre equipos de soldadura.<br><br><strong>Ejemplo 2:</strong> En una planta de fabricación, los trabajadores deben usar equipos de protección personal cuando realicen trabajos de soldadura y estar capacitados en procedimientos de primeros auxilios para quemaduras.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con equipos de soldadura.",
  "32. ¿Qué responsabilidades tiene un empleador en caso de exposición a campos electromagnéticos?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de protección electromagnética como el uso de barreras y la limitación del tiempo de exposición, y realizar monitoreos periódicos de los niveles de radiación. Además, debe capacitar a los trabajadores en el manejo seguro de equipos que emiten campos electromagnéticos y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En una planta de telecomunicaciones, los trabajadores deben usar barreras protectoras y limitar su tiempo de exposición a las antenas de transmisión. Deben estar capacitados en procedimientos de emergencia en caso de exposición.<br><br><strong>Ejemplo 2:</strong> En una fábrica de equipos electrónicos, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para minimizar la exposición a campos electromagnéticos. Deben recibir capacitación en el manejo seguro de estos equipos.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección electromagnética y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a campos electromagnéticos.",
  "33. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con productos químicos?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes, gafas y delantales resistentes a productos químicos, y capacitar a los trabajadores en el manejo seguro de estos productos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de contacto con productos químicos.<br><br><strong>Ejemplo 1:</strong> En una planta de fabricación de productos químicos, los trabajadores deben usar guantes, gafas y delantales cuando manipulen sustancias peligrosas. Las áreas de trabajo deben estar señalizadas con advertencias sobre productos químicos.<br><br><strong>Ejemplo 2:</strong> En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con agentes químicos peligrosos y estar capacitados en procedimientos de primeros auxilios para tratar quemaduras químicas.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con productos químicos.",
  "34. ¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de ahogamiento?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como chalecos salvavidas y arneses de seguridad, y capacitar a los trabajadores en procedimientos de rescate y primeros auxilios. Además, debe realizar evaluaciones de riesgos y asegurar que los trabajadores tengan acceso a equipos de comunicación y rescate.<br><br><strong>Ejemplo 1:</strong> En trabajos de mantenimiento en puertos, los trabajadores deben usar chalecos salvavidas y estar capacitados en procedimientos de rescate acuático. Las áreas de trabajo deben estar señalizadas con advertencias sobre riesgo de ahogamiento.<br><br><strong>Ejemplo 2:</strong> En la construcción de puentes sobre cuerpos de agua, los trabajadores deben usar arneses de seguridad y chalecos salvavidas. Deben recibir capacitación en el uso de equipos de rescate y en procedimientos de primeros auxilios.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores en trabajos con riesgo de ahogamiento.",

    "35. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con superficies calientes?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes resistentes al calor, delantales y mangas largas, y capacitar a los trabajadores en el manejo seguro de superficies calientes. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br><br><strong>Ejemplo 1:</strong> En una cocina industrial, los cocineros deben usar guantes resistentes al calor y delantales cuando manipulen ollas y sartenes calientes. Las áreas de trabajo deben estar señalizadas con advertencias sobre superficies calientes.<br><br><strong>Ejemplo 2:</strong> En una planta de fabricación de vidrio, los trabajadores deben usar guantes y mangas largas resistentes al calor cuando manipulen vidrio recién fundido. Deben estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con superficies calientes.",
  "36. ¿Qué responsabilidades tiene un empleador en caso de exposición a polvo en el lugar de trabajo?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de control de polvo como sistemas de extracción y ventilación, y proporcionar equipos de protección respiratoria como mascarillas y respiradores. Además, debe realizar monitoreos periódicos de los niveles de polvo en el aire y capacitar a los trabajadores en el uso adecuado de los equipos de protección.<br><br><strong>Ejemplo 1:</strong> En una fábrica de cemento, los trabajadores deben usar mascarillas y respiradores para protegerse del polvo. La planta debe estar equipada con sistemas de extracción de polvo.<br><br><strong>Ejemplo 2:</strong> En una carpintería, los trabajadores deben usar mascarillas cuando trabajen con madera para evitar la inhalación de polvo. La carpintería debe tener sistemas de ventilación adecuados.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección respiratoria y los sistemas de control de polvo necesarios para garantizar la seguridad de los trabajadores.",
  "37. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con objetos punzantes?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes resistentes a cortes y gafas de seguridad, y capacitar a los trabajadores en el manejo seguro de objetos punzantes. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de cortes.<br><br><strong>Ejemplo 1:</strong> En un taller de costura, los trabajadores deben usar guantes resistentes a cortes cuando manipulen tijeras y agujas. Las áreas de trabajo deben estar señalizadas con advertencias sobre objetos punzantes.<br><br><strong>Ejemplo 2:</strong> En una fábrica de metal, los trabajadores deben usar guantes y gafas de seguridad cuando trabajen con láminas de metal. Deben estar capacitados en procedimientos de primeros auxilios para tratar cortes.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con objetos punzantes.",
  "38. ¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de caída de personas?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección contra caídas como arneses, líneas de vida y barandillas, y realizar evaluaciones de riesgos antes de comenzar el trabajo. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En trabajos de limpieza de ventanas en edificios altos, los trabajadores deben usar arneses de seguridad conectados a líneas de vida y trabajar en plataformas con barandillas. Deben estar capacitados en el uso de los arneses y en procedimientos de rescate.<br><br><strong>Ejemplo 2:</strong> En la construcción de puentes, los trabajadores deben usar arneses y líneas de vida cuando trabajen en alturas. Deben recibir capacitación en el uso de estos equipos y en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 1409 de 2012 establece las medidas de protección contra caídas y la capacitación necesaria para garantizar la seguridad de los trabajadores en alturas.",
  "39. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con maquinaria pesada?<br>• <strong>Respuesta:</strong> El empleador debe asegurar que la maquinaria esté equipada con dispositivos de seguridad como protectores y sistemas de parada de emergencia, y capacitar a los trabajadores en su uso seguro. Además, debe realizar mantenimientos periódicos de la maquinaria y asegurar que los trabajadores conozcan los procedimientos de primeros auxilios en caso de lesiones.<br><br><strong>Ejemplo 1:</strong> En una fábrica de automóviles, las máquinas deben tener protectores para evitar el atrapamiento de manos y los trabajadores deben estar capacitados en el uso de los sistemas de parada de emergencia. Deben recibir capacitación en procedimientos de primeros auxilios.<br><br><strong>Ejemplo 2:</strong> En una planta de construcción, las grúas y excavadoras deben tener sistemas de seguridad y los operadores deben estar capacitados en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir lesiones por contacto con maquinaria pesada.",
  "40. ¿Qué responsabilidades tiene un empleador en caso de exposición a agentes químicos peligrosos?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de protección como el uso de guantes, gafas y delantales resistentes a productos químicos, y realizar monitoreos periódicos de los niveles de exposición. Además, debe capacitar a los trabajadores en el manejo seguro de agentes químicos y en procedimientos de emergencia.<br><br><strong>Ejemplo 1:</strong> En una planta de fabricación de productos químicos, los trabajadores deben usar guantes, gafas y delantales cuando manipulen sustancias peligrosas. La planta debe realizar monitoreos periódicos de los niveles de exposición.<br><br><strong>Ejemplo 2:</strong> En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con agentes químicos peligrosos y estar capacitados en procedimientos de emergencia.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a agentes químicos peligrosos.",
  "41. ¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con equipos eléctricos?<br>• <strong>Respuesta:</strong> El empleador debe proporcionar equipos de protección como guantes aislantes y capacitar a los trabajadores en el manejo seguro de equipos eléctricos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de electrocución.<br><br><strong>Ejemplo 1:</strong> En una planta de energía, los electricistas deben usar guantes aislantes y seguir los procedimientos de seguridad al trabajar con paneles eléctricos. El empleador debe proporcionar primeros auxilios y reportar el incidente a la ARL.<br><br><strong>Ejemplo 2:</strong> En una fábrica, los trabajadores deben usar equipos de protección personal cuando realicen mantenimiento de maquinaria eléctrica y estar capacitados en procedimientos de primeros auxilios para quemaduras eléctricas.<br><br><strong>Normativa:</strong> Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con equipos eléctricos.",

  "42. ¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de intoxicación alimentaria?<br>• <strong>Respuesta:</strong> El empleador debe implementar medidas de higiene y seguridad alimentaria como el uso de guantes, gorros y delantales, y capacitar a los trabajadores en prácticas de manipulación segura de alimentos. Además, debe realizar inspecciones periódicas de las áreas de trabajo y asegurar que los trabajadores conozcan los procedimientos de emergencia en caso de intoxicación.<br><br><strong>Ejemplo 1:</strong> En una cocina industrial, los cocineros deben usar guantes, gorros y delantales cuando preparen alimentos y seguir prácticas de higiene adecuadas. Las áreas de trabajo deben estar señalizadas con advertencias sobre higiene alimentaria.<br><br><strong>Ejemplo 2:</strong> En una planta de procesamiento de alimentos, los trabajadores deben usar equipos de protección personal y estar capacitados en prácticas de manipulación segura de alimentos. Deben recibir capacitación en procedimientos de emergencia en caso de intoxicación.<br><br><strong>Normativa:</strong> Resolución 2674 de 2013 establece las medidas de higiene y seguridad alimentaria necesarias para prevenir intoxicaciones alimentarias.",

"49.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con equipos de corte?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes resistentes a cortes y gafas de seguridad, y capacitar a los trabajadores en el manejo seguro de equipos de corte. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de cortes.<br>	Ejemplo 1: En un taller de carpintería, los trabajadores deben usar guantes resistentes a cortes y gafas de seguridad cuando utilicen sierras y cuchillas. Las áreas de trabajo deben estar señalizadas con advertencias sobre equipos de corte.<br>	Ejemplo 2: En una fábrica de metal, los trabajadores deben usar guantes y gafas de seguridad cuando trabajen con láminas de metal y equipos de corte. Deben estar capacitados en procedimientos de primeros auxilios para tratar cortes.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con equipos de corte.<br>42.	¿Qué medidas de seguridad deben implementarse en trabajos con riesgo de intoxicación alimentaria?<br>	Respuesta: El empleador debe implementar medidas de higiene y seguridad alimentaria como el uso de guantes, gorros y delantales, y capacitar a los trabajadores en prácticas de manipulación segura de alimentos. Además, debe realizar inspecciones periódicas de las áreas de trabajo y asegurar que los trabajadores conozcan los procedimientos de emergencia en caso de intoxicación.<br>	Ejemplo 1: En una cocina industrial, los cocineros deben usar guantes, gorros y delantales cuando preparen alimentos y seguir prácticas de higiene adecuadas. Las áreas de trabajo deben estar señalizadas con advertencias sobre higiene alimentaria.<br>	Ejemplo 2: En una planta de procesamiento de alimentos, los trabajadores deben usar equipos de protección personal y estar capaci   "55.	¿Qué medidas de seguridad deben implementarse en el almacenamiento de materiales plásticos?<br>	Respuesta: El empleador debe implementar medidas de seguridad como el uso de estanterías adecuadas, señalización y sistemas de ventilación. Además, debe capacitar a los trabajadores en el manejo seguro y almacenamiento de materiales plásticos.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los materiales deben almacenarse en estanterías adecuadas y las áreas de almacenamiento deben estar señalizadas con advertencias sobre materiales plásticos.<br>	Ejemplo 2: En un almacén de distribución de plásticos, los trabajadores deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para el almacenamiento de materiales plásticos.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de seguridad y la capacitación necesaria para garantizar el almacenamiento seguro de materiales plásticos.<br>56.	¿Qué debe hacer un empleador si un trabajador sufre una intoxicación por inhalación de vapores plásticos?<br>	Respuesta: El empleador debe proporcionar equipos de protección respiratoria como mascarillas y respiradores, y asegurar una ventilación adecuada en el lugar de trabajo. Además, debe capacitar a los trabajadores en el uso adecuado de los equipos de protección respiratoria y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar respiradores adecuados y el área debe estar equipada con sistemas de ventilación para evitar la acumulación de vapores plásticos. Deben estar capacitados en procedimientos de emergencia.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar mascarillas y respiradores para protegerse de vapores plásticos y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección respiratoria y la capacitación necesaria para prevenir intoxicaciones por inha auxilios para tratar quemaduras.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con moldes calientes.<br>59.	¿Qué medidas de seguridad deben implementarse en la limpieza de equipos de producción de plásticos?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes, gafas y mascarillas, y capacitar a los trabajadores en el manejo seguro de productos de limpieza y en procedimientos de limpieza de equipos. Además, debe asegurar que las áreas de trabajo estén adecuadamente ventiladas y señalizadas.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes, gafas y mascarillas cuando limpien los equipos de producción. Las áreas de trabajo deben estar ventiladas para evitar la acumulación de vapores de limpieza.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando limpien los equipos de producción y estar capacitados en procedimientos de limpieza segura.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad en la limpieza de equipos de producción de plásticos.<br>60.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con productos plásticos en estado fundido?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes resistentes al calor, delantales y mangas largas, y capacitar a los trabajadores en el manejo seguro de productos plásticos en estado fundido. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes y delantales resistentes al calor cuando manipulen productos plásticos en estado fundido. Las áreas de trabajo deben estar señalizadas con advertencias sobre productos plásticos calientes.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con productos plásticos en estado fundido y estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con productos plásticos en estado fundido.",
  "61.	¿Qué medidas de seguridad deben implementarse en la operación de máquinas de inyección de plástico?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes, gafas y delantales, y capacitar a los trabajadores en el manejo seguro de máquinas de inyección de plástico. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes, gafas y delantales cuando operen máquinas de inyección de plástico. Las áreas de trabajo deben estar señalizadas con advertencias sobre máquinas de inyección.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando operen máquinas de inyección de plástico y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad en la operación de máquinas de inyección de plástico.<br>62.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por atrapamiento en una máquina de inyección?<br>	Respuesta: El empleador debe asegurar que las máquinas de inyección estén equipadas con dispositivos de seguridad como protectores y sistemas de parada de emergencia, y capacitar a los trabajadores en su uso seguro. Además, debe realizar mantenimientos periódicos de las máquinas y asegurar que los trabajadores conozcan los procedimientos de primeros auxilios en caso de atrapamiento.<br>	Ejemplo 1: En una planta de fabricación de plásticos, las máquinas de inyección deben tener protectores para evitar el atrapamiento de manos y los trabajadores deben estar capacitados en el uso de los sistemas de parada de emergencia. Deben recibir capacitación en procedimientos de primeros auxilios.<br>	Ejemplo 2: En un laboratorio de investigación, las máquinas de inyección deben estar equipadas con sistemas de seguridad y los trabajadores deben estar capacitados en su uso seguro. Deben conocer los procedimientos de emergencia en caso de atrapamiento.<br>	Normativa: Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir accidentes por atrapamiento en máquinas de inyección.<br>63.	¿Qué responsabilidades tiene un empleador en caso de exposición a humos de plástico durante el proceso de inyección?<br>	Respuesta: El empleador debe implementar medidas de ventilación y proporcionar equipos de protección respiratoria como mascarillas y respiradores. Además, debe realizar monitoreos periódicos de los niveles de exposición y capacitar a los trabajadores en el manejo seguro de humos de plástico y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar respiradores adecuados y el área debe estar equipada con sistemas de ventilación para evitar la acumulación de humos de plástico. Deben estar capacitados en procedimientos de emergencia.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar mascarillas y respiradores para protegerse de humos de plástico y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección respiratoria y la capacitación necesaria para prevenir intoxicaciones por humos de plástico.<br>64.	¿Qué debe hacer un empleador si un trabajador sufre una quemadura por contacto con boquillas de inyección?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes resistentes al calor y delantales, y capacitar a los trabajadores en el manejo seguro de boquillas de inyección. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes y delantales resistentes al calor cuando manipulen boquillas de inyección. Las áreas de trabajo deben estar señalizadas con advertencias sobre boquillas calientes.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con boquillas de inyección y estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir quemaduras por contacto con boquillas de inyección.<br>65.	¿Qué medidas de seguridad deben implementarse en el mantenimiento de máquinas de inyección de plástico?<br>	Respuesta: El empleador debe asegurar que las máquinas de inyección estén en buen estado y realizar mantenimientos periódicos. Además, debe proporcionar equipos de protección como guantes y gafas de seguridad, y capacitar a los trabajadores en el manejo seguro de las máquinas y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, las máquinas de inyección deben ser revisadas regularmente y los trabajadores deben usar guantes y gafas de seguridad durante el mantenimiento. Deben estar capacitados en procedimientos de emergencia.<br>	Ejemplo 2: En un laboratorio de investigación, las máquinas de inyección deben estar en buen estado y los trabajadores deben usar equipos de protección personal durante el mantenimiento. Deben recibir capacitación en el manejo seguro de las máquinas.<br>	Normativa: Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para garantizar el mantenimiento seguro de máquinas de inyección de plástico.<br>66.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con piezas de plástico recién moldeadas?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes resistentes al calor y delantales, y capacitar a los trabajadores en el manejo seguro de piezas de plástico recién moldeadas. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes y delantales resistentes al calor cuando manipulen piezas de plástico recién moldeadas. Las áreas de trabajo deben estar señalizadas con advertencias sobre piezas calientes.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con piezas de plástico recién moldeadas y estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con piezas de plástico recién moldeadas.<br>67.	¿Qué responsabilidades tiene un empleador en caso de exposición a agentes químicos utilizados en la inyección de plásticos?<br>	Respuesta: El empleador debe implementar medidas de protección como el uso de guantes, gafas y mascarillas, y realizar monitoreos periódicos de los niveles de exposición. Además, debe capacitar a los trabajadores en el manejo seguro de agentes químicos y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes, gafas y mascarillas cuando manipulen agentes químicos utilizados en la inyección de plásticos. La planta debe realizar monitoreos periódicos de los niveles de exposición.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con agentes químicos y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a agen

 de fabricación de plásticos, los trabajadores deben usar guantes y delantales resistentes al calor cuando manipulen boquillas de soplado. Las áreas de trabajo deben estar señalizadas con advertencias sobre boquillas calientes.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con boquillas de soplado y estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir quemaduras por contacto con boquillas de soplado.<br>75.	¿Qué medidas de seguridad deben implementarse en el mantenimiento de máquinas de inyección y soplado de plástico?<br>	Respuesta: El empleador debe asegurar que las máquinas de inyección y soplado estén en buen estado y realizar mantenimientos periódicos. Además, debe proporcionar equipos de protección como guantes y gafas de seguridad, y capacitar a los trabajadores en el manejo seguro de las máquinas y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, las máquinas de inyección y soplado deben ser revisadas regularmente y los trabajadores deben usar guantes y gafas de seguridad durante el mantenimiento. Deben estar capacitados en procedimientos de emergencia.<br>	Ejemplo 2: En un laboratorio de investigación, las máquinas de inyección y soplado deben estar en buen estado y los trabajadores deben usar equipos de protección personal durante el mantenimiento. Deben recibir capacitación en el manejo seguro de las máquinas.<br>	Normativa: Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para garantizar el mantenimiento seguro de máquinas de inyección y soplado de plástico.<br>76.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con piezas de plástico recién sopladas?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes resistentes al calor y delantales, y capacitar a los trabajadores en el manejo seguro de piezas de plástico recién sopladas. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes y delantales resistentes al calor cuando manipulen piezas de plástico recién sopladas. Las áreas de trabajo deben estar señalizadas con advertencias sobre piezas calientes.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con piezas de plástico recién sopladas y estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con piezas de plástico recién sopladas.<br>77.	¿Qué responsabilidades tiene un empleador en caso de exposición a agentes químicos utilizados en la inyección y soplado de plásticos?<br>	Respuesta: El empleador debe implementar medidas de protección como el uso de guantes, gafas y mascarillas, y realizar monitoreos periódicos de los niveles de exposición. Además, debe capacitar a los trabajadores en el manejo seguro de agentes químicos y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes, gafas y mascarillas cuando manipulen agentes químicos utilizados en la inyección y soplado de plásticos. La planta debe realizar monitoreos periódicos de los niveles de exposición.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con agentes químicos y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a agentes químicos utilizados en la inyección y soplado de plásticos.<br>78.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con sistemas de enfriamiento de moldes en soplado?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes y gafas de seguridad, y capacitar a los trabajadores en el manejo seguro de sistemas de enfriamiento de moldes. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de lesiones.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes y gafas de seguridad cuando trabajen con sistemas de enfriamiento de moldes. Las áreas de trabajo deben estar señalizadas con advertencias sobre sistemas de enfriamiento.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con sistemas de enfriamiento de moldes y estar capacitados en procedimientos de primeros auxilios para tratar lesiones.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con sistemas de enfriamiento de moldes.<br>79.	¿Qué medidas de seguridad deben implementarse en la manipulación de materiales reciclados en la inyección y soplado de plásticos?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes, gafas y mascarillas, y capacitar a los trabajadores en el manejo seguro de materiales reciclados. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y ventiladas.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes, gafas y mascarillas cuando manipulen materiales reciclados. Las áreas de trabajo deben estar señalizadas y ventiladas para evitar la acumulación de vapores.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con materiales reciclados y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad en la manipulación de materiales reciclados en la inyección y soplado de plásticos.<br>80.	¿Qué debe hacer un empleador si un trabajador sufre una lesión por contacto con equipos de corte de piezas sopladas?<br>	Respuesta: El empleador debe proporcionar equipos de protección como guantes resistentes a cortes y gafas de seguridad, y capacitar a los trabajadores en el manejo seguro de equipos de corte. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los trabajadores conozcan los procedimientos de primeros auxilios en caso de cortes.<br>	Ejemplo 1: En una planta de fabricación de plásticos, los trabajadores deben usar guantes resistentes a cortes y gafas de seguridad cuando utilicen equipos de corte de piezas sopladas. Las áreas de trabajo deben estar señalizadas con advertencias sobre equipos de corte.<br>	Ejemplo 2: En un laboratorio de investigación, los trabajadores deben usar equipos de protección personal cuando trabajen con equipos de corte de piezas sopladas y estar capacitados en procedimientos de primeros auxilios para tratar cortes.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con equipos de corte de piezas sopladas.",
  "81.	¿Quién es responsable si un contratista sufre un accidente laboral en las instalaciones del contratante?<br>	Respuesta: El contratante debe asegurarse de que el contratista esté afiliado a una ARL y que cumpla con las normas de seguridad y salud en el trabajo. El contratante debe coordinar con la ARL del contratista para garantizar la atención médica y el reporte del accidente.<br>	Ejemplo 1: Si un contratista sufre una caída mientras realiza trabajos de mantenimiento en una empresa, el contratante debe verificar que el contratista esté afiliado a una ARL y que se sigan las normas de seguridad. Debe coordinar con la ARL para asegurar la atención médica del contratista.<br>	Ejemplo 2: Si un contratista se electrocuta mientras instala un sistema eléctrico, el contratante debe asegurarse de que el contratista reciba atención médica y que el accidente sea reportado a la ARL.<br>	Normativa: Decreto 1072 de 2015 establece las responsabilidades del contratante y del contratista en materia de seguridad y salud en el trabajo.<br>82.	¿Qué procedimiento debe seguirse si un contratista presenta una enfermedad laboral?<br>	Respuesta: El contratante debe reportar la enfermedad a la ARL del contratista y tomar medidas para prevenir futuros casos. Esto incluye realizar evaluaciones médicas periódicas y mejorar las condiciones laborales.<br>	Ejemplo 1: Si un contratista desarrolla una enfermedad respiratoria debido a la exposición a polvo en la fábrica, el contratante debe reportar el caso a la ARL, mejorar la ventilación y proporcionar mascarillas adecuadas.<br>	Ejemplo 2: Si un contratista presenta una enfermedad de la piel por contacto con productos químicos, el contratante debe reportar la enfermedad, proporcionar guantes y mejorar las prácticas de manejo de productos químicos.<br>	Normativa: Resolución 2346 de 2007 establece las medidas para la prevención y control de enfermedades laborales y la obligación de reportar a la ARL.<br>83.	¿Qué medidas de seguridad deben implementarse para contratistas que trabajan en altura?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección contra caídas como arneses de seguridad, barandillas, redes de protección y plataformas de trabajo seguras. Además, debe capacitar a los contratistas en el uso adecuado de los equipos de protección y en procedimientos de emergencia.<br>	Ejemplo 1: En una construcción, los contratistas deben usar arneses de seguridad y la zona de trabajo debe estar equipada con barandillas y redes para prevenir caídas. Deben estar capacitados en el uso de los arneses y en procedimientos de rescate.<br>	Ejemplo 2: En trabajos de mantenimiento en techos, los contratistas deben usar líneas de vida y plataformas de trabajo seguras. Deben recibir capacitación en el uso de estos equipos y en procedimientos de emergencia.<br>	Normativa: Resolución 1409 de 2012 establece las medidas de protección contra caídas y la capacitación necesaria para garantizar la seguridad de los trabajadores en alturas.<br>84.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con maquinaria pesada?<br>	Respuesta: El contratante debe asegurar que la maquinaria esté equipada con dispositivos de seguridad como protectores y sistemas de parada de emergencia, y capacitar a los contratistas en su uso seguro. Además, debe realizar mantenimientos periódicos de la maquinaria y asegurar que los contratistas conozcan los procedimientos de primeros auxilios en caso de lesiones.<br>	Ejemplo 1: En una fábrica de automóviles, las máquinas deben tener protectores para evitar el atrapamiento de manos y los contratistas deben estar capacitados en el uso de los sistemas de parada de emergencia. Deben recibir capacitación en procedimientos de primeros auxilios.<br>	Ejemplo 2: En una planta de construcción, las grúas y excavadoras deben tener sistemas de seguridad y los operadores deben estar capacitados en procedimientos de emergencia.<br>	Normativa: Decreto 1072 de 2015 establece las medidas de seguridad y la capacitación necesaria para prevenir lesiones por contacto con maquinaria pesada.<br>85.	¿Qué responsabilidades tiene un contratante en caso de exposición de contratistas a sustancias químicas peligrosas?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección personal (EPP) como guantes, gafas y mascarillas, y capacitar a los contratistas en el manejo seguro de sustancias químicas. Además, debe asegurar una ventilación adecuada en el lugar de trabajo y realizar monitoreos periódicos de los niveles de exposición.<br>	Ejemplo 1: En una planta química, los contratistas deben usar guantes resistentes a productos químicos, gafas de seguridad y mascarillas adecuadas. La planta debe estar equipada con sistemas de ventilación para evitar la acumulación de vapores tóxicos.<br>	Ejemplo 2: En un laboratorio, los contratistas deben usar equipos de protección personal cuando manipulen sustancias peligrosas y estar capacitados en procedimientos de emergencia.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a sustancias químicas.<br>86.	¿Qué debe hacer un contratante si un contratista sufre una intoxicación por inhalación de gases?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección respiratoria como mascarillas y respiradores, y asegurar una ventilación adecuada en el lugar de trabajo. Además, debe capacitar a los contratistas en el uso adecuado de los equipos de protección respiratoria y en procedimientos de emergencia.<br>	Ejemplo 1: En una planta química, los contratistas deben usar respiradores adecuados y el área debe estar equipada con sistemas de ventilación para evitar la acumulación de gases tóxicos. Deben estar capacitados en procedimientos de emergencia.<br>	Ejemplo 2: En una mina subterránea, los contratistas deben usar mascarillas y respiradores para protegerse de gases peligrosos. Deben recibir capacitación en el uso de estos equipos y en procedimientos de rescate.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección respiratoria y la capacitación necesaria para prevenir intoxicaciones por inhalación de gases.<br>87.	¿Qué medidas de seguridad deben implementarse para contratistas que trabajan en espacios confinados?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección como respiradores y arneses de seguridad, y capacitar a los contratistas en procedimientos de emergencia. Además, debe realizar evaluaciones de riesgos y asegurar que los contratistas tengan acceso a equipos de comunicación y rescate.<br>	Ejemplo 1: En trabajos de mantenimiento en tanques, los contratistas deben usar respiradores y arneses de seguridad. Deben estar capacitados en procedimientos de emergencia y tener acceso a equipos de comunicación.<br>	Ejemplo 2: En la limpieza de alcantarillas, los contratistas deben usar equipos de protección personal y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el uso de equipos de rescate.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores en espacios confinados.<br>88.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con equipos eléctricos?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección como guantes aislantes y capacitar a los contratistas en el manejo seguro de equipos eléctricos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los contratistas conozcan los procedimientos de primeros auxilios en caso de electrocución.<br>	Ejemplo 1: En una planta de energía, los contratistas deben usar guantes aislantes y seguir los procedimientos de seguridad al trabajar con paneles eléctricos. El contratante debe proporcionar primeros auxilios y reportar el incidente a la ARL.<br>	Ejemplo 2: En una fábrica, los contratistas deben usar equipos de protección personal cuando realicen mantenimiento de maquinaria eléctrica y estar capacitados en procedimientos de primeros auxilios para quemaduras eléctricas.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con equipos eléctricos.<br>89. ¿Qué responsabilidades tiene un contratante en caso de exposición de contratistas a ruido excesivo?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con protección auditiva como tapones o auriculares. Además, debe realizar monitoreos periódicos de los niveles de ruido y capacitar a los contratistas en el uso adecuado de los equipos de protección auditiva.<br>o	Ejemplo 1: En una fábrica con maquinaria ruidosa, los contratistas deben usar tapones auditivos y la empresa debe instalar barreras acústicas para reducir el ruido. Deben estar capacitados en el uso adecuado de los tapones auditivos.<br>o	Ejemplo 2: En una planta de procesamiento de alimentos, los contratistas deben usar auriculares protectores y la empresa debe realizar monitoreos periódicos de los niveles de ruido.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección auditiva y la capacitación necesaria para prevenir daños auditivos por exposición a ruido excesivo.",
  "90.	¿Qué debe hacer un contratante si un contratista sufre una lesión por caída de altura?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección contra caídas como arneses y líneas de vida, y asegurar que las áreas de trabajo en altura estén equipadas con barandillas y redes de seguridad. Además, debe capacitar a los contratistas en el uso adecuado de los equipos de protección y en procedimientos de emergencia.<br>o	Ejemplo 1: En la construcción de un edificio, los contratistas deben usar arneses de seguridad y las plataformas de trabajo deben tener barandillas y redes de protección. Deben estar capacitados en el uso de los arneses y en procedimientos de rescate.<br>o	Ejemplo 2: En trabajos de mantenimiento en torres de telecomunicaciones, los contratistas deben usar líneas de vida y arneses de seguridad. Deben recibir capacitación en el uso de estos equipos y en procedimientos de emergencia.<br>o	Normativa: Resolución 1409 de 2012 establece las medidas de protección contra caídas y la capacitación necesaria para garantizar la seguridad de los trabajadores en alturas.<br>91.	¿Qué medidas de seguridad deben implementarse para contratistas que manipulan materiales peligrosos?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección personal (EPP) como guantes, gafas y delantales, y capacitar a los contratistas en el manejo seguro de materiales peligrosos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y ventiladas.<br>o	Ejemplo 1: En una planta de fabricación de productos químicos, los contratistas deben usar guantes, gafas y delantales cuando manipulen materiales peligrosos. Las áreas de trabajo deben estar señalizadas y ventiladas para evitar la acumulación de vapores.<br>o	Ejemplo 2: En un laboratorio de investigación, los contratistas deben usar equipos de protección personal cuando trabajen con materiales peligrosos y estar capacitados en procedimientos de emergencia.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad en la manipulación de materiales peligrosos.<br>92.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con herramientas manuales?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección como guantes y gafas de seguridad, y capacitar a los contratistas en el uso seguro de herramientas manuales. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los contratistas conozcan los procedimientos de primeros auxilios en caso de lesiones.<br>o	Ejemplo 1: En un taller de carpintería, los contratistas deben usar guantes y gafas de seguridad cuando utilicen sierras y martillos. Las áreas de trabajo deben estar señalizadas con advertencias sobre herramientas manuales.<br>o	Ejemplo 2: En una fábrica de metal, los contratistas deben usar guantes y gafas de seguridad cuando trabajen con láminas de metal. Deben estar capacitados en procedimientos de primeros auxilios para tratar cortes y heridas.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con herramientas manuales.<br>93.	¿Qué responsabilidades tiene un contratante en caso de exposición de contratistas a vibraciones?<br>o	Respuesta: El contratante debe implementar medidas de control de vibraciones, proporcionar equipos de protección como guantes antivibración y realizar evaluaciones periódicas de los niveles de vibración. Además, debe capacitar a los contratistas en el uso adecuado de los equipos de protección y en técnicas para minimizar la exposición a vibraciones.<br>o	Ejemplo 1: En una fábrica donde se utilizan herramientas vibrantes, los contratistas deben usar guantes antivibración y las máquinas deben ser revisadas regularmente para minimizar las vibraciones. Deben estar capacitados en técnicas para reducir la exposición a vibraciones.<br>o	Ejemplo 2: En la construcción, los operadores de maquinaria pesada deben usar equipos de protección antivibración y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el uso de estos equipos y en técnicas para minimizar la exposición a vibraciones.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a vibraciones.<br>94.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con superficies calientes?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección como guantes resistentes al calor, delantales y mangas largas, y capacitar a los contratistas en el manejo seguro de superficies calientes. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los contratistas conozcan los procedimientos de primeros auxilios en caso de quemaduras.<br>o	Ejemplo 1: En una cocina industrial, los contratistas deben usar guantes resistentes al calor y delantales cuando manipulen ollas y sartenes calientes. Las áreas de trabajo deben estar señalizadas con advertencias sobre superficies calientes.<br>o	Ejemplo 2: En una planta de fabricación de vidrio, los contratistas deben usar guantes y mangas largas resistentes al calor cuando manipulen vidrio recién fundido. Deben estar capacitados en procedimientos de primeros auxilios para tratar quemaduras.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con superficies calientes.<br>95.	¿Qué medidas de seguridad deben implementarse para contratistas que trabajan con productos inflamables?<br>o	Respuesta: El contratante debe implementar medidas de prevención de incendios como la eliminación de fuentes de ignición, el uso de equipos a prueba de explosiones y la capacitación de los contratistas en procedimientos de emergencia. Además, debe realizar evaluaciones de riesgos y asegurar que los contratistas conozcan los procedimientos de evacuación en caso de incendio.<br>o	Ejemplo 1: En una planta de procesamiento de gas, se deben eliminar las fuentes de ignición y utilizar equipos eléctricos a prueba de explosiones. Los contratistas deben estar capacitados en procedimientos de evacuación.<br>o	Ejemplo 2: En una fábrica de productos químicos, los contratistas deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para prevenir incendios. Deben recibir capacitación en el manejo de extintores y en procedimientos de evacuación.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de prevención y protección necesarias para garantizar la seguridad de los trabajadores en trabajos con riesgo de incendio.<br>96.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con productos radiactivos?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección radiológica como dosímetros, guantes y batas, y realizar monitoreos periódicos de los niveles de radiación. Además, debe capacitar a los contratistas en el manejo seguro de productos radiactivos y en procedimientos de emergencia.<br>o	Ejemplo 1: En un hospital, los técnicos de radiología contratistas deben usar dosímetros y trabajar en áreas protegidas con barreras de plomo. Deben estar capacitados en procedimientos de emergencia en caso de exposición a radiaciones.<br>o	Ejemplo 2: En una planta de investigación nuclear, los contratistas deben usar equipos de protección radiológica y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el manejo seguro de materiales radiactivos y en procedimientos de emergencia.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección radiológica y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a productos radiactivos.<br>97. ¿Qué responsabilidades tiene un contratante en caso de exposición de contratistas a agentes biológicos?<br>o	Respuesta: El contratante debe implementar medidas de protección biológica como el uso de guantes, mascarillas y batas, y realizar monitoreos periódicos de los agentes biológicos presentes en el lugar de trabajo. Además, debe capacitar a los contratistas en el manejo seguro de agentes biológicos y en procedimientos de emergencia.<br>o	Ejemplo 1: En un laboratorio de microbiología, los contratistas deben usar guantes, mascarillas y batas para protegerse de agentes biológicos. Deben estar capacitados en procedimientos de emergencia en caso de exposición.<br>o	Ejemplo 2: En una planta de tratamiento de aguas residuales, los contratistas deben usar equipos de protección personal y seguir procedimientos de seguridad específicos para prevenir la exposición a agentes biológicos. Deben recibir capacitación en el manejo seguro de estos agentes.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección biológica y la capacitación necesaria para garantizar la seguridad de los trabajadores expuestos a agentes biológicos.<br>98.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con líquidos corrosivos?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección como guantes resistentes a productos químicos, gafas de seguridad y delantales, y capacitar a los contratistas en el manejo seguro de líquidos corrosivos. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los contratistas conozcan los procedimientos de primeros auxilios en caso de contacto con líquidos corrosivos.<br>o	Ejemplo 1: En un laboratorio químico, los contratistas deben usar guantes, gafas y delantales cuando manipulen ácidos o bases fuertes. Las áreas de trabajo deben estar señalizadas con advertencias sobre líquidos corrosivos.<br>o	Ejemplo 2: En una planta de tratamiento de aguas, los contratistas deben usar equipos de protección personal cuando manipulen productos químicos corrosivos. Deben estar capacitados en procedimientos de primeros auxilios para tratar quemaduras químicas.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con líquidos corrosivos.<br>99.	¿Qué medidas de seguridad deben implementarse para contratistas que trabajan en la construcción?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección personal (EPP) como cascos, guantes, botas y arneses de seguridad, y capacitar a los contratistas en el manejo seguro de herramientas y maquinaria. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los contratistas conozcan los procedimientos de emergencia.<br>o	Ejemplo 1: En una obra de construcción, los contratistas deben usar cascos, guantes, botas y arneses de seguridad. Las áreas de trabajo deben estar señalizadas con advertencias sobre riesgos específicos.<br>o	Ejemplo 2: En la construcción de un puente, los contratistas deben usar equipos de protección personal y seguir procedimientos de seguridad específicos. Deben recibir capacitación en el manejo seguro de herramientas y maquinaria.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad en trabajos de construcción.<br>100.	¿Qué debe hacer un contratante si un contratista sufre una lesión por contacto con equipos de alta presión?<br>o	Respuesta: El contratante debe verificar que los contratistas cuenten con equipos de protección como guantes y gafas de seguridad, y capacitar a los contratistas en el manejo seguro de equipos de alta presión. Además, debe asegurar que las áreas de trabajo estén adecuadamente señalizadas y que los contratistas conozcan los procedimientos de primeros auxilios en caso de lesiones.<br>o	Ejemplo 1: En una planta de fabricación, los contratistas deben usar guantes y gafas de seguridad cuando trabajen con equipos de alta presión. Las áreas de trabajo deben estar señalizadas con advertencias sobre equipos de alta presión.<br>o	Ejemplo 2: En una planta de procesamiento de alimentos, los contratistas deben usar equipos de protección personal cuando realicen trabajos con equipos de alta presión y estar capacitados en procedimientos de primeros auxilios para tratar lesiones.<br>o	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para prevenir lesiones por contacto con equipos de alta presión.<br>101.	¿Quién es responsable si un contratista sufre un accidente de tránsito mientras se desplaza al lugar de trabajo?<br>	Respuesta: Si el contratista sufre un accidente de tránsito mientras se desplaza al lugar de trabajo en un vehículo particular, no se considera un accidente laboral y no está cubierto por la ARL. En este caso, el SOAT (Seguro Obligatorio de Accidentes de Tránsito) o la EPS (Entidad Promotora de Salud) son responsables de cubrir los gastos médicos.<br>	Ejemplo 1: Un contratista que se desplaza en su moto particular sufre un accidente de tránsito camino al trabajo. El SOAT cubre los gastos médicos.<br>	Ejemplo 2: Un contratista que se desplaza en su automóvil particular sufre un accidente de tránsito camino al trabajo. La EPS cubre los gastos médicos.<br>	Normativa: Ley 1562 de 2012 establece que los accidentes de tránsito ocurridos durante el desplazamiento al trabajo no son considerados accidentes laborales a menos que el transporte sea proporcionado por el empleador.<br>102.	¿Qué procedimiento debe seguirse si un contratista sufre un accidente en un vehículo particular durante su jornada laboral?<br>	Respuesta: Si el accidente ocurre durante la jornada laboral y el contratista está realizando actividades laborales, se considera un accidente laboral y la ARL es responsable de cubrir los gastos médicos y prestaciones económicas.<br>	Ejemplo 1: Un contratista que realiza una entrega en su vehículo particular sufre un accidente de tránsito. La ARL cubre los gastos médicos y prestaciones económicas.<br>	Ejemplo 2: Un contratista que se desplaza entre diferentes sitios de trabajo en su vehículo particular sufre un accidente de tránsito. La ARL cubre los gastos médicos y prestaciones económicas.<br>	Normativa: Ley 1562 de 2012 establece que los accidentes ocurridos durante la ejecución de actividades laborales son considerados accidentes laborales y están cubiertos por la ARL.<br>103.	¿Qué medidas de seguridad deben implementarse para contratistas que utilizan motos para desplazarse al trabajo?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con el equipo de protección adecuado (casco, guantes, chaleco reflectivo) y que la moto esté en buen estado. Además, los contratistas deben estar afiliados a una ARL.<br>	Ejemplo 1: Un contratista que utiliza una moto para desplazarse al trabajo debe usar casco, guantes y chaleco reflectivo. El contratante verifica que la moto esté en buen estado.<br>	Ejemplo 2: Un contratista que realiza entregas en moto debe estar afiliado a una ARL y usar el equipo de protección adecuado.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad de los trabajadores que utilizan motos.<br>104.	¿Qué debe hacer un contratante si un contratista sufre un accidente en un vehículo de transporte informal (mototaxi, bicitaxi)?<br>	Respuesta: El contratante debe asegurarse de que los contratistas no utilicen transporte informal debido a los riesgos y la falta de cobertura de seguros. Deben utilizar transporte legal y seguro. Si ocurre un accidente en transporte informal, el SOAT o la EPS cubren los gastos médicos.<br>	Ejemplo 1: Un contratista que utiliza un mototaxi sufre un accidente de tránsito. El SOAT cubre los gastos médicos.<br>	Ejemplo 2: Un contratista que utiliza un bicitaxi sufre un accidente de tránsito. La EPS cubre los gastos médicos.<br>	Normativa: Ley 336 de 1996 establece que el transporte informal no está regulado y no ofrece cobertura de seguros adecuada.<br>105.	¿Qué responsabilidades tiene un contratante en caso de que un contratista sufra un accidente en un vehículo de transporte público?<br>	Respuesta: Si el accidente ocurre en transporte público, la EPS o el SOAT cubren los gastos médicos. El contratante debe verificar que los contratistas estén afiliados a una ARL y que utilicen transporte seguro y legal.<br>	Ejemplo 1: Un contratista que utiliza un bus público sufre un accidente de tránsito. El SOAT cubre los gastos médicos.<br>	Ejemplo 2: Un contratista que utiliza un servicio de transporte público sufre un accidente de tránsito. La EPS cubre los gastos médicos.<br>	Normativa: Ley 1562 de 2012 establece que los accidentes ocurridos en transporte público no son considerados accidentes laborales a menos que el transporte sea proporcionado por el empleador.<br>106.	¿Qué debe hacer un contratante si un contratista sufre un accidente mientras utiliza un servicio de transporte como Uber?<br>	Respuesta: Si el accidente ocurre durante el uso de un servicio como Uber, la EPS o el SOAT cubren los gastos médicos. El contratante debe verificar que los contratistas estén afiliados a una ARL y que utilicen transporte seguro y legal.<br>	Ejemplo 1: Un contratista que utiliza un servicio de Uber sufre un accidente de tránsito. El SOAT cubre los gastos médicos.<br>	Ejemplo 2: Un contratista que utiliza un servicio de transporte como Uber sufre un accidente de tránsito. La EPS cubre los gastos médicos.<br>	Normativa: Ley 1562 de 2012 establece que los accidentes ocurridos durante el uso de servicios de transporte como Uber no son considerados accidentes laborales a menos que el transporte sea proporcionado por el empleador.<br>107.	¿Qué medidas de seguridad deben implementarse para contratistas que utilizan bicicletas para desplazarse al trabajo?<br>	Respuesta: El contratante debe verificar que los contratistas cuenten con el equipo de protección adecuado (casco, chaleco reflectivo) y que la bicicleta esté en buen estado. Además, los contratistas deben estar afiliados a una ARL.<br>	Ejemplo 1: Un contratista que utiliza una bicicleta para desplazarse al trabajo debe usar casco y chaleco reflectivo. El contratante verifica que la bicicleta esté en buen estado.<br>	Ejemplo 2: Un contratista que realiza entregas en bicicleta debe estar afiliado a una ARL y usar el equipo de protección adecuado.<br>	Normativa: Resolución 2404 de 2019 establece las medidas de protección personal y la capacitación necesaria para garantizar la seguridad de los trabajadores que utilizan bicicletas.<br>108.	¿Qué debe hacer un contratante si un contratista sufre un accidente en un taxi durante su jornada laboral?<br>	Respuesta: Si el accidente ocurre durante la jornada laboral y el taxi es utilizado para cumplir funciones laborales, se considera un accidente laboral y la ARL es responsable de cubrir los gastos médicos y prestaciones económicas.<br>	Ejemplo 1: Un contratista que utiliza un taxi para realizar una entrega sufre un accidente de tránsito. La ARL cubre los gastos médicos y prestaciones económicas.<br>	Ejemplo 2: Un contratista que se desplaza entre diferentes sitios de trabajo en un taxi sufre un accidente de tránsito. La ARL cubre los gastos médicos y prestaciones económicas.<br>	Normativa: Ley 1562 de 2012 establece que los accidentes ocurridos durante la ejecución de actividades laborales son considerados accidentes laborales y están cubiertos por la ARL.<br>109.	¿Qué responsabilidades tiene un contratante en caso de que un contratista sufra un accidente en un vehículo de transporte legal?<br>	Respuesta: Si el accidente ocurre en un vehículo de transporte legal durante la jornada laboral, se considera un accidente laboral y la ARL es responsable de cubrir los gastos médicos y prestaciones económicas.<br>	Ejemplo 1: Un contratista que utiliza un bus legal para desplazarse entre sitios de trabajo sufre un accidente de tránsito. La ARL cubre los gastos médicos y prestaciones económicas.<br>	Ejemplo 2: Un contratista que utiliza un servicio de transporte legal sufre un accidente de tránsito durante su jornada laboral. La ARL cubre los gastos médicos y prestaciones económicas.<br>	Normativa: Ley 1562 de 2012 establece que los accidentes ocurridos durante la ejecución de actividades laborales son considerados accidentes laborales y están cubiertos por la ARL.",
  "110. ¿Qué debe hacer un contratante si un contratista sufre un accidente en un vehículo de transporte proporcionado por la empresa?<br>	Respuesta: El contratante debe reportar el accidente a la ARL y asegurarse de que el contratista reciba atención médica inmediata. La ARL determinará si el accidente es considerado laboral.<br>	Ejemplo 1: Un contratista sufre un accidente en un vehículo proporcionado por la empresa. El contratante reporta el accidente a la ARL.<br>	Ejemplo 2: Un contratista sufre un accidente en un bus proporcionado por la empresa. El contratante reporta el accidente a la ARL.<br>	Normativa: La Ley 1562 de 2012 y el Decreto 1072 de 2015 establecen los procedimientos para reportar accidentes laborales.<br>111.	¿Quién es responsable si un empleado sufre un accidente de tránsito mientras se desplaza al lugar de trabajo?<br>	Respuesta: Si un empleado sufre un accidente de tránsito mientras se desplaza al lugar de trabajo en un vehículo particular, no se considera un accidente laboral y no está cubierto por la ARL. En este caso, el SOAT o la EPS son responsables de cubrir los gastos médicos.<br>	Ejemplo 1: Un empleado que se desplaza en su moto particular sufre un accidente de tránsito camino al trabajo. El SOAT cubre los gastos médicos.<br>	Ejemplo 2: Un empleado que se desplaza en su automóvil particular sufre un accidente de tránsito camino al trabajo. La EPS cubre los gastos médicos.<br>	Normativa: La Ley 1562 de 2012 establece que los accidentes de tránsito ocurridos durante el desplazamiento al trabajo no son considerados accidentes laborales a menos que el transporte sea proporcionado por el empleador.<br>112. ¿Qué procedimiento debe seguirse si un empleado sufre un accidente en un vehículo particular durante su jornada laboral?<br>o	Respuesta: Si un empleado sufre un accidente en un vehículo particular durante su jornada laboral, el accidente debe ser reportado inmediatamente a la ARL por el empleador. La ARL realizará una investigación para determinar si el accidente es considerado laboral.<br>o	Ejemplo 1: Un empleado sufre un accidente mientras realiza una entrega en su vehículo particular. El empleador reporta el accidente a la ARL.<br>o	Ejemplo 2: Un empleado sufre un accidente mientras se dirige a una reunión de trabajo en su automóvil. El empleador reporta el accidente a la ARL.<br>o	Normativa: La Ley 1562 de 2012 y el Decreto 1072 de 2015 establecen los procedimientos para reportar accidentes laborales.<br>113. ¿Qué medidas de seguridad deben implementarse para empleados que utilizan motos para desplazarse al trabajo?<br>o	Respuesta: Las medidas de seguridad incluyen el uso obligatorio de casco, chaleco reflectivo, y luces permanentes en la moto. Además, se recomienda el uso de sistemas de frenado avanzado como ABS y llantas certificadas.<br>o	Ejemplo 1: Un empleado utiliza una moto con frenos ABS y siempre lleva casco y chaleco reflectivo.<br>o	Ejemplo 2: Un empleado utiliza una moto con luces permanentes y llantas certificadas.<br>o	Normativa: La Cámara de Industrias de Motocicletas de la ANDI ha implementado estas medidas de seguridad a partir de 2025.<br>114. ¿Qué debe hacer un empleador si un empleado sufre un accidente en un vehículo de transporte informal (mototaxi, bicitaxi)?<br>o	Respuesta: El empleador debe reportar el accidente a la ARL y asegurarse de que el empleado reciba atención médica inmediata. La ARL determinará si el accidente es considerado laboral.<br>o	Ejemplo 1: Un empleado sufre un accidente en un mototaxi. El empleador reporta el accidente a la ARL.<br>o	Ejemplo 2: Un empleado sufre un accidente en un bicitaxi. El empleador reporta el accidente a la ARL.<br>o	Normativa: La Ley 1562 de 2012 y el Decreto 1072 de 2015 establecen los procedimientos para reportar accidentes laborales.<br>115. ¿Qué responsabilidades tiene un empleador en caso de que un empleado sufra un accidente en un vehículo de transporte público?<br>o	Respuesta: El empleador debe reportar el accidente a la ARL y asegurarse de que el empleado reciba atención médica inmediata. La ARL determinará si el accidente es considerado laboral.<br>o	Ejemplo 1: Un empleado sufre un accidente en un bus público. El empleador reporta el accidente a la ARL.<br>o	Ejemplo 2: Un empleado sufre un accidente en un tren público. El empleador reporta el accidente a la ARL.<br>o	Normativa: La Ley 1562 de 2012 y el Decreto 1072 de 2015 establecen los procedimientos para reportar accidentes laborales.<br>116. ¿Qué debe hacer un empleador si un empleado sufre un accidente mientras utiliza un servicio de transporte como Uber?<br>o	Respuesta: El empleador debe reportar el accidente a la ARL y asegurarse de que el empleado reciba atención médica inmediata. La ARL determinará si el accidente es considerado laboral.<br>o	Ejemplo 1: Un empleado sufre un accidente mientras utiliza un servicio de Uber. El empleador reporta el accidente a la ARL.<br>o	Ejemplo 2: Un empleado sufre un accidente mientras utiliza un servicio de Didi. El empleador reporta el accidente a la ARL.<br>o	Normativa: La Ley 1562 de 2012 y el Decreto 1072 de 2015 establecen los procedimientos para reportar accidentes laborales.<br>117. ¿Qué medidas de seguridad deben implementarse para empleados que utilizan bicicletas para desplazarse al trabajo?<br>o	Respuesta: Las medidas de seguridad incluyen el uso obligatorio de casco, chaleco reflectivo, y luces en la bicicleta. Además, se recomienda el uso de elementos de protección adicionales como rodilleras y coderas.<br>o	Ejemplo 1: Un empleado utiliza una bicicleta con luces y siempre lleva casco y chaleco reflectivo.<br>o	Ejemplo 2: Un empleado utiliza una bicicleta con elementos de protección adicionales como rodilleras y coderas.<br>o	Normativa: La Ley 1811 de 2016 y los lineamientos de la Agencia Nacional de Seguridad Vial establecen estas medidas de seguridad.<br>118. ¿Qué debe hacer un empleador si un empleado sufre un accidente en un taxi durante su jornada laboral?<br>o	R

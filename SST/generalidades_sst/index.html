<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuestionario SST</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="cuestionario-contenedor">
        <h1>Fundamentos de SST</h1>

        <div class="pregunta-area">
            <p id="pregunta-texto">Cargando pregunta...</p>
        </div>

        <div class="botones-interaccion">
            <button id="mostrar-respuesta">Mostrar Respuesta</button>
            <button id="siguiente-pregunta" style="display: none;">Siguiente Pregunta</button>
        </div>

        <div class="respuesta-area" id="respuesta-area" style="display: none;">
            <h2>Respuesta:</h2>
            <p id="respuesta-texto"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
